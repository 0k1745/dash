name: task-manager backend CI

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - ".github/workflows/task-manager-backend-ci.yml"
  pull_request:
    paths:
      - "apps/**"
      - ".github/workflows/task-manager-backend-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify
        working-directory: apps
        run: mvn -pl task-manager/bootstrap -am verify
